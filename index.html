<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陰陽メガネ｜食の陰陽辞典・クイズ・シミュレーター</title>
<meta name="description" content="陰陽の見方を練習する場所。食の陰陽辞典、陰陽クイズ、陰陽シミュレーターの3つがあります。">
<link rel="icon" href="favicon.ico">
<style>
  :root{
    --yo:#C1440E;        /* 陽の橙（看板バンド） */
    --ink:#2F3A2F;       /* 本文 */
    --sub:#546054;
    --green-deep:#33513C;/* 深緑（アクセント） */
    --cream:#F7F4EE;
    --card:#FFFFFF;
    --line:#E4DFD2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:17px; line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 40px;}

  /* 看板：2段バンド（投稿の看板と同系統） */
  .band{
    background:var(--yo); color:#fff; border-radius:999px;
    text-align:center; font-weight:700;
    font-size:30px; letter-spacing:.04em;
    padding:14px 16px; line-height:1.3;
  }
  .band-sub{
    display:inline-block; margin-top:10px;
    background:#fff; color:var(--green-deep);
    border:2px solid var(--green-deep); border-radius:999px;
    font-size:15px; font-weight:700; padding:4px 16px; line-height:1.5;
  }
  .band-wrap{text-align:center; margin-top:8px;}
  .hero{
    display:block; width:220px; max-width:60vw; height:auto;
    margin:18px auto 6px;
  }
  .lead{text-align:center; color:var(--sub); font-size:16px; margin:10px 8px 22px;}

  /* 3コーナーのカード（森のslimカードと同体裁） */
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:14px 16px; margin:0 0 14px;
    text-decoration:none; color:var(--ink);
    min-height:76px;
  }
  .card img{
    width:64px; height:64px; object-fit:cover; border-radius:12px; flex:none;
  }
  .card .t{font-size:19px; font-weight:700; line-height:1.4;}
  .card .d{font-size:15px; color:var(--sub); line-height:1.5; margin-top:2px;}
  .card .go{margin-left:auto; color:var(--yo); font-size:22px; flex:none;}

  /* 下部のリンク置き場 */
  .links{margin-top:30px; border-top:1px solid var(--line); padding-top:18px;}
  .links a{
    display:flex; align-items:center; min-height:48px;
    color:var(--green-deep); font-weight:700; text-decoration:none;
    padding:6px 4px;
  }
  .foot{
    text-align:center; color:var(--sub); font-size:14px; margin-top:26px;
  }
  img{height:auto;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 看板 -->
  <div class="band">☯ 陰陽メガネ 👓</div>
  <div class="band-wrap"><span class="band-sub">食の陰陽</span></div>

  <img class="hero" src="inyo-megane-taikyoku-v2.webp" alt="太極図にメガネをかけた絵" width="1600" height="1600">

  <!-- TODO: リード文は後で詰める（雛形の仮文） -->
  <p class="lead">陰陽の見方を、目で見て練習する場所です。</p>

  <!-- 3コーナー -->
  <a class="card" href="inyo.html">
    <img src="guide-inyo.jpg" alt="" width="800" height="800" loading="lazy">
    <span>
      <span class="t">食の陰陽辞典</span>
      <span class="d" style="display:block;">食べ物の陰と陽を、絵と図で引ける辞典です。</span>
    </span>
    <span class="go">›</span>
  </a>

  <a class="card" href="inyo-quiz.html">
    <img src="quiz-keeper-glasses.webp" alt="" width="640" height="640" loading="lazy">
    <span>
      <span class="t">陰陽クイズ</span>
      <span class="d" style="display:block;">2つのものを比べて、陰陽を読む練習コーナーです。</span>
    </span>
    <span class="go">›</span>
  </a>

  <a class="card" href="inyo-sim.html">
    <img src="inyo-sim-card.webp" alt="" width="1600" height="1600" loading="lazy">
    <span>
      <span class="t">陰陽シミュレーター</span>
      <span class="d" style="display:block;">陽と陰を足すと、丸いかたまりがどう変わるか。触って感じる体験コーナーです。</span>
    </span>
    <span class="go">›</span>
  </a>

  <!-- 導線（リンク置き場） -->
  <div class="links">
    <a href="https://mizujoshinomori.pages.dev/">🌳 集まれ水女子の森へもどる</a>
    <a href="https://takechanlink.pages.dev/">🔗 たけちゃんリンク（全部の窓口）</a>
  </div>

  <p class="foot">心体調整塾</p>

</div>
</body>
</html>
